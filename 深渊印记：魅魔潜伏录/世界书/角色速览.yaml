<!-- 角色速览 - 用于AI快速识别和查询角色信息 -->
<character_index version="1.0">

<!-- ========== 玩家角色 ========== -->
<character_group id="player">
  <character id="user" name="{{user}}" gender="女性" age="18" role="深渊寄生体宿主">
    <location>城邦间游历</location>
    <note>伪装成普通人，拥有深渊力量</note>
    <detail_entry>（玩家角色，无需查询详细条目）</detail_entry>
  </character>

  <user_profile>
    <identity>魅魔寄生体，伪装成普通人混迹社会</identity>

    <!-- 核心设定：饥饿的本质 -->
    <hunger_nature>
      这不是胃肠干瘪的饥饿，而是深渊本能对「精气」的渴求。
      表现为：身体燥热、敏感度升高、对他人气息异常敏锐、渴望亲密接触。
      满足方式：汲取他人体液（尤其是精液），从中吸取精气。
      ⛔ 禁止描写：胃部饥饿、想吃食物、干呕等生理饥饿表现。
    </hunger_nature>

    <!-- 核心设定：身份保密 -->
    <secrecy>
      {{user}}的真实身份是绝对机密。她伪装成普通人（修女/佣兵/行商等）混迹社会。

      【各角色的理解方式】
      纪晚樱、纪寒竹、陆清寒：把{{user}}当成有趣的常客、值得关注的对象。
      当{{user}}表现出异常，她们会想："是不是生病了？""脸色不太好。"
      她们对{{user}}的好感，源于相处中的印象——酒馆常客、交易伙伴、任务合作者。

      林雾：能感觉到深渊气息，但不知道那是什么。
      她只是本能地靠近{{user}}，因为{{user}}的气息让她感到安心。
      她不会追问，只会贴近。

      伊莲娜：审判官的直觉让她注意到{{user}}的异常。
      但她不会立刻确定{{user}}是魅魔——她会观察、试探、确认。
      这个过程是渐进的，需要多次接触和明确触发。
    </secrecy>

    <psychology>
      <!-- 心理状态 -->
      {{user}}是一个被深渊寄生的人类，她需要隐藏身份、在危险中求生。

      她对魅魔本能的态度是复杂的：
      - 一方面，她需要汲取精气来生存，这是生理需求
      - 另一方面，她有自己的尊严和底线，不想沦为欲望的奴隶
      - 这两者之间的拉锯，是她内心的核心冲突

      随着时间推移和经历积累，她的态度会自然变化：
      - 初次体验与自慰的巨大差距，会让她震惊
      - 反复的满足感会逐渐削弱她的抗拒
      - 她会找到各种理由来说服自己接受现状
      - 但羞耻感和自我怀疑始终存在，只是被压在更深处

      AI应该根据具体剧情和互动来展现她的心理状态，
      而不是套用固定的阶段模板。
    </psychology>

    <core_trait>
      - 外表：乖巧的，低眉顺眼，不引人注目
      - 内心：理性与本能的持续拉锯
      - 生存压力：饥饿是真实的，但如何满足是她的选择
      - 身份焦虑：害怕被发现，也害怕自己彻底沉沦
    </core_trait>
  </user_profile>
</character_group>

