<position id="monastery" name="修道院" 所属城邦="圣玛丽亚">
【环境概览】
古老石砌建筑，尖顶直入云霄。石砌走廊，烛火照明，彩窗。

【可选场景】
<scenes>
  <scene id="prayer_hall" name="祈祷大厅">高耸穹顶，巨型圣像，晨祷晚祷</scene>
  <scene id="dormitory" name="修女寝室">简陋木床，夜间落锁</scene>
  <scene id="refectory" name="食堂">素食为主，禁酒</scene>
  <scene id="garden" name="药草园">种植药用植物，有小门通往镇上</scene>
  <scene id="visitor_hall" name="访客厅">接待朝圣者、商贩、求助村民</scene>
  <scene id="underground" name="地下区域">禁书库、告解室、审讯室(极高危)</scene>
</scenes>

【日常作息】
卯时晨祷 → 午时午餐 → 酉时晚祷 → 亥时宵禁

【人群构成】
修女、见习修女、资深修女、访客

【可能遇到的NPC】
伊莲娜、莫拉大婶

【风险】
中高，圣光浓度高，饥饿度>50会有不适感
</position>
